<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'"
  >
  <title>Secure XSS Training Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="page-shell">
    <h1>Secure XSS Training Lab</h1>

    <p class="intro-warning">
      This page treats all user input as text. It does not intentionally execute JavaScript.
    </p>

    <section class="card">
      <h2>Safe Reflected-Style Output</h2>

      <form id="messageForm">
        <label for="messageInput">Enter a message:</label>
        <textarea id="messageInput" maxlength="500"></textarea>
        <button type="submit">Display Message</button>
      </form>

      <div id="messageOutput" class="output" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>Safe DOM Output</h2>

      <label for="domInput">Enter another message:</label>
      <textarea id="domInput" maxlength="500"></textarea>
      <button id="domButton" type="button">Display Safely</button>

      <div id="domOutput" class="output" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>Validation Result</h2>

      <p id="status" class="status success" aria-live="polite">
        No input has been submitted yet.
      </p>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
